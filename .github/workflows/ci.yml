name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch/PR cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Placeholder configuration so modules that read env can load. Nothing here
      # connects to a database or decrypts data, and none of these values are
      # secrets: they are fixed, public, CI-only strings (32 bytes, base64).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      AUTH_SECRET: Y2ktb25seS1hdXRoLXNlY3JldC1ub3QtcmVhbC0wMDE=
      PII_ENCRYPTION_KEYS: "1:Y2ktb25seS1waWkta2V5LXYxLW5vdC1yZWFsLTAwMDE="
      PII_ACTIVE_KEY_VERSION: "1"
      PII_BLIND_INDEX_KEY: Y2ktb25seS1ibGluZC1pbmRleC1ub3QtcmVhbC0wMDE=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # postinstall runs `prisma generate`, so the Prisma client types exist for tsc.
      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check message catalogues (TET/PT/ID/EN)
        run: npm run i18n:check

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'messages/**', '*.config.*') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # next/font downloads Google Fonts at build time and that fetch is occasionally
      # flaky. One retry absorbs a transient network error; a real build error fails twice.
      - name: Build
        run: npm run build || { echo "::warning::Build failed once (often a transient Google Fonts fetch); retrying"; npm run build; }
